[project]
name = "goldbot"
version = "0.1.0"
description = "A gold ETF trading bot that explains every decision it makes"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "exchange-calendars>=4.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
goldbot = "goldbot.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldbot"]

# --------------------------------------------------------------------------
# Testing
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "constitution: asserts a constitutional non-negotiable still holds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/goldbot"]
branch = true

# --------------------------------------------------------------------------
# Linting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# --------------------------------------------------------------------------
# Type checking
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/goldbot"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "goldbot.domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
