# Probe 1 of 2: does the allow-list actually fail closed?
#
# `run.symbol` is SPY, which is not gold and is not in the instruments table.
# Expected: exit code 4 before any run is recorded — Principle II refuses at
# the boundary rather than part-way through.
#
# See config/halt-probe.toml for the probe that exercises the risk gate
# during a run.

[run]
symbol = "SPY"
cadence = "daily"
initial_equity = "100000.00"

[instruments.GLD]
name = "Gold ETF (physically backed)"
calendar = "XNYS"
expense_ratio = "0.0040"
half_spread_bps = "1.0"
slippage_bps = "2.0"

[risk]
max_risk_per_trade = "0.010"
max_daily_loss = "0.030"
max_concurrent_positions = 1
max_leverage = "2.0"

[strategy]
trend_lookback = 100
momentum_lookback = 20
atr_lookback = 14
atr_stop_multiple = "2.0"
reward_risk_target = "2.0"
min_history = 100

[events]
policy = "stand_aside"
blackout_dates = []
