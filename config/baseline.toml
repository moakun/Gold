# Baseline strategy configuration.
#
# Every number is a quoted string so it becomes an exact Decimal. TOML floats
# are refused on load — binary floating point in a price is how two runs of the
# same backtest end up disagreeing.

[run]
symbol = "GLD"
cadence = "daily"
initial_equity = "100000.00"

# The allow-list. Principle II: anything absent from here cannot be traded,
# and adding an entry is a config change plus a covering test.
[instruments.GLD]
name = "Gold ETF (physically backed)"
calendar = "XNYS"
# Disclosed in reports, never charged as a cost. A physically-backed fund pays
# its fee by selling metal, so the drag is already inside the share price this
# system trades. See research.md R10.
expense_ratio = "0.0040"
commission_per_share = "0.00"
commission_minimum = "0.00"
# Half the quoted spread, in basis points of price, charged on entry and exit.
half_spread_bps = "1.0"
# Additional adverse move assumed on every fill.
slippage_bps = "2.0"

# Constitution defaults. Amendable only through the governance process.
[risk]
max_risk_per_trade = "0.010"
max_daily_loss = "0.030"
max_concurrent_positions = 1
max_leverage = "2.0"

[strategy]
# Long-term trend filter: price above this average or no long is considered.
trend_lookback = 100
# Breakout window for the entry trigger.
momentum_lookback = 20
atr_lookback = 14
# Stop distance as a multiple of ATR. Wider stops survive noise but cut size.
atr_stop_multiple = "2.0"
# Target distance as a multiple of the stop distance.
reward_risk_target = "2.0"
# No decision is made until this much history exists.
min_history = 100

[events]
# FR-019: scheduled high-impact releases get an explicit policy, never chance.
policy = "stand_aside"
blackout_dates = []
